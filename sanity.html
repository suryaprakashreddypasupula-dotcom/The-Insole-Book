<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sanity — highlight detection check</title>
<style>
  body{margin:0;font-family:-apple-system,sans-serif;background:#eceef1;color:#111}
  h1{font-size:16px;padding:14px 18px;margin:0}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px;padding:0 14px 24px}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card canvas{width:100%;height:300px;display:block}
  .card p{margin:0;padding:8px 12px 12px;font-size:12px;color:#444}
</style>
</head>
<body>
<h1>Highlight detection sanity check — top view</h1>
<div id="grid"></div>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js","three/addons/loaders/GLTFLoader.js":"./vendor/GLTFLoader.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const catalog = await (await fetch('./catalog.json')).json();
const grid = document.getElementById('grid');
const loader = new GLTFLoader();

function makeCard(entry, side){
  const m = entry.models[side];
  const card = document.createElement('div');
  card.className = 'card';
  const canvas = document.createElement('canvas');
  const label = document.createElement('p');
  label.textContent = `${entry.po} ${side} — ${entry.categories.join(' + ')} · relief ${m.relief_area_pct}% pad ${m.pad_area_pct}%`;
  card.append(canvas, label);
  grid.append(card);

  const W = 420, H = 300;
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(2);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf2f3f5);
  const cam = new THREE.PerspectiveCamera(30, W/H, 1, 4000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(150, 400, 220); scene.add(key);
  const fill = new THREE.DirectionalLight(0xcfd8ff, 0.9); fill.position.set(-200, 150, -120); scene.add(fill);

  loader.load(m.file, g => {
    g.scene.traverse(o => {
      if (o.isMesh && !o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      if (o.isMesh) o.material = new THREE.MeshStandardMaterial({
        vertexColors:true, roughness:.55, metalness:.08,
        color: 0xbfc2c8   /* multiplies vertex colors up so sculpt reads */
      });
    });
    scene.add(g.scene);
    // orient flat: thinnest bbox axis is the insole's up; make it +Y
    let box = new THREE.Box3().setFromObject(g.scene);
    let size = box.getSize(new THREE.Vector3());
    const dims = [['x',size.x],['y',size.y],['z',size.z]].sort((a,b)=>a[1]-b[1]);
    const thin = dims[0][0];
    if (thin === 'z') g.scene.rotation.x = -Math.PI/2;
    else if (thin === 'x') g.scene.rotation.z = Math.PI/2;
    g.scene.updateMatrixWorld(true);
    box = new THREE.Box3().setFromObject(g.scene);
    size = box.getSize(new THREE.Vector3());
    const c = box.getCenter(new THREE.Vector3());
    const longest = Math.max(size.x, size.z);
    // top-down, slight tilt so depth reads; length axis across the canvas
    const lenAxis = size.x >= size.z ? 'x' : 'z';
    cam.position.set(c.x + (lenAxis==='z'? longest*0.12 : 0),
                     c.y + longest * 1.15,
                     c.z + (lenAxis==='x'? longest*0.12 : 0));
    cam.up.set(lenAxis==='x' ? 0 : 1, 0, lenAxis==='x' ? -1 : 0);
    cam.lookAt(c);
    renderer.render(scene, cam);
  });
}
for (const entry of catalog)
  for (const side of Object.keys(entry.models)) makeCard(entry, side);
</script>
</body>
</html>
